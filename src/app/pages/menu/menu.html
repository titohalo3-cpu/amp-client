<header class="menu">
  <a routerLink="/dashboard" class="logo">Amp<span>Client</span></a>

  @if (auth.isLogged()) {
    <nav class="enlaces" [class.abierto]="abierto()" (click)="abierto.set(false)">
      <a routerLink="/dashboard" routerLinkActive="activo">Inicio</a>
      <a routerLink="/videojuegos" routerLinkActive="activo">Videojuegos</a>
      @if (esGestor()) {
        <a routerLink="/admin" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Gestión</a>
      }
      <a routerLink="/perfil" routerLinkActive="activo" class="usuario">
        {{ auth.session()?.user?.nombre }} <small class="rol">{{ auth.rol() }}</small>
      </a>
      <button type="button" class="btn-texto" (click)="salir()">Salir</button>
    </nav>

    <a routerLink="/carrito" class="carrito" aria-label="Ver carrito">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="21" r="1" /><circle cx="20" cy="21" r="1" />
        <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6" />
      </svg>
      <!-- Truco: al cambiar el número se crea un span nuevo y se repite la animación "pop" -->
      @for (n of [cart.totalUnidades()]; track n) {
        <span class="badge" [class.vacio]="n === 0" animate.enter="pop">{{ n }}</span>
      }
    </a>

    <button type="button" class="hamburguesa" (click)="abierto.set(!abierto())" [attr.aria-expanded]="abierto()" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
  } @else {
    <nav class="enlaces visibles">
      <a routerLink="/login" routerLinkActive="activo">Entrar</a>
      <a routerLink="/registro" routerLinkActive="activo">Registro</a>
    </nav>
  }
</header>
